# managed by humanize 1.10.4; replaced on deploy, removed on uninstall
# Gate profile for the humanize skill. The gate counts errors + warnings only; suggestions are information.
# The Packages line is generated from humanize/data/versions.json (pinned releases).
StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip, https://github.com/vale-cli/write-good/releases/download/v0.4.1/write-good.zip

[*.md]
# Company and tech: Microsoft. General prose: write-good.
# Tried and removed in 1.10.3: proselint, Voices, and curated ai-tells rules, after a blind A/B test (8 AI-drafted
# documents, humanize workers, two judges); and Readability, whose scores never showed value and do not suit governance text.
# For the three styles: Where they changed the brief, the edits without them won 4-0 (4 ties) with half the
# meaning errors (6 vs 12); humanize's own word list already removed 24 of the 29 phrases they target, and proselint's
# "Very" rule pushed a worker to weaken "very positive" to "positive".
BasedOnStyles = Microsoft, write-good

# Noise on business and guidance prose: flags every "is", every "we", every "she".
write-good.E-Prime = NO
Microsoft.We = NO
Microsoft.Vocab = NO

# Valid in formal or clinical register ("does not", "calmly"); keep as hints, not gate failures.
Microsoft.Contractions = suggestion
Microsoft.Adverbs = suggestion

# Tuned on the AICC charter golden set (37 documents, 69,000 words; 137 findings judged blind): these fired on clean,
# human-reviewed governance text and were wrong or harmful there (write-good.TooWordy flags "shall"; Microsoft.Headings and
# HeadingAcronyms flag document names and defined terms; Terms turns "agent" into "assistant"). humanize's own word list and
# heading check cover the same ground with defined-term and document-name awareness, so these are information only.
write-good.Passive = suggestion
write-good.TooWordy = suggestion
write-good.Weasel = suggestion
Microsoft.Headings = suggestion
Microsoft.HeadingAcronyms = suggestion
Microsoft.Terms = suggestion
Microsoft.FirstPerson = suggestion
# Wrong on this kind of text: logical punctuation is valid, lowercase after a heading colon is house style, and
# Microsoft.Spacing misreads names such as "O!Bank" (humanize tidy already handles double spaces).
Microsoft.Quotes = NO
Microsoft.HeadingColons = NO
Microsoft.Spacing = NO

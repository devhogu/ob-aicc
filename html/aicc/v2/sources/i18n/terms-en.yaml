# English term list of the AI Competence Hub (C-HUB-V2-EN, T-001).
# Every English text of the Hub (pages, data, interface strings, catalog) uses these renderings.
# Sources: aicc/v2/vocabulary/*.yaml (id, ru, en), the English corpus (charter/en/documents/vocabulary.md,
# charter/en/shared-technology-terminology.md) and charter/ru/translation-en-ru-map.md. Where the vocabulary
# and the English corpus differ, the corpus wording wins and the entry carries a note.
# Sections: terms (one per vocabulary id), names (fixed names by group), phrases (recurring interface and
# content phrases), plurals, formats, forbidden_en, laws. Style rules: aicc/v2/i18n/style-en.md.
# Checked by aicc/v2/tests/test_terms_en.py.


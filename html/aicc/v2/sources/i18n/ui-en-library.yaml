# regulation page
"Кто и что регулирует AI и данные — у нас, в регионе и в мире. Коротко: что это за документ и что он значит для нас. Это ориентир для разговора, а не юридическое заключение; за точным текстом обращайтесь к первоисточнику и юристам.": "Who regulates what in AI and data: here, in the region, and worldwide. In short: what each document is and what it means for us. This is a starting point for discussion, not legal advice; for the exact text, go to the original source and to the lawyers."
"требования, которые применяются напрямую": "requirements that apply to us directly"
"важно при выборе поставщиков и партнёров": "matters when choosing suppliers and partners"
"куда движутся регулирование и практика": "where regulation and practice are heading"
"Найти: закон, регулятор, тема": "Search: law, regulator, topic"
"Регуляторы и нормативные акты": "Regulators and legal acts"
"Кто регулирует AI и данные у нас, в регионе и в мире, и что это значит для нас.": "Who regulates AI and data here, in the region, and worldwide, and what it means for us."

# resources page
"Открытые источники, которые стоит знать: где учиться, где следить за отраслью, что читают регуляторы финансового сектора и где искать сведения об атаках и инцидентах. Внешние сервисы — только для чтения: рабочие данные туда не отправляем.": "Open resources worth knowing: where to learn, where to follow the industry, what financial regulators read, and where to find information on attacks and incidents. External services are for reading only: we never send work data to them."
"Найти: курс, доклад, тема": "Search: course, report, topic"
"Ресурсы для обучения и исследований": "Learning and research resources"
"Где учиться, где следить за отраслью и где искать сведения об атаках и инцидентах.": "Where to learn, where to follow the industry, and where to find information on attacks and incidents."

# Anthropic learning page
"Всё обучение от Anthropic, создателя Claude, в одном месте: сначала официальные материалы на русском, затем учебный портал Claude Academy с бесплатными курсами и практические материалы на английском. Ссылки ведут на первоисточник.": "All the learning from Anthropic, the maker of Claude, in one place: first the official documentation, then the Claude Academy learning portal with its free courses, and then hands-on material. Links go to the original source."
"Короткие пересказы самого полезного — на русском и с нашими примерами — в {link}.": "Short summaries of the most useful material, with our own examples, are in the {link}."
"Базе знаний": "Knowledge Base"
"Найти: курс, тема, продукт": "Search: course, topic, product"
"Обучение Anthropic": "Anthropic learning"
"Claude Academy и все её курсы, официальная документация на русском и практические материалы Anthropic.": "Claude Academy and all its courses, the official documentation, and hands-on material from Anthropic."


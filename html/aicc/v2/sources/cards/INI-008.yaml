id: INI-008
title: "Базы знаний функций"
summary: "Строим базы знаний функций Банка по одному общему подходу: ответы единообразны, со ссылками на источники, у каждого источника есть тот, кто его ведёт, и дата пересмотра."
profile: initiative
class_of_service: инициатива
stage: Воронка
area: "Сервисы знаний"
people:
  business_owner: {position: "представитель функции, чьи знания собираются в базу", holder: ""}
  product_manager: {position: "менеджер продукта Хаба по этой теме", holder: ""}
  project_manager: {position: "кто ведёт проект", holder: ""}
outcome:
  problem: "У каждой функции есть знания, которые сотрудники ежедневно ищут или уточняют у коллег. Они лежат в документах, которые не ведутся как контролируемые источники. Ответы на одни и те же вопросы различаются, а знания уходят вместе с сотрудниками."
  intended_outcome: "Общий подход ко всем базам знаний, ранжированный перечень баз по функциям, первая база знаний для правовой функции в работе, начата вторая."
  measure: "Число источников с тем, кто их ведёт, и датой пересмотра; число ответов со ссылкой на источник; число сотрудников, которые пользуются базой."
  baseline: "Не измерено."
  target: "Не задано."
constraints:
  appetite: "Без отдельного бюджета: рабочее время того, кто ведёт проект."
  review_point: "К концу 2026 года: смотрим, что получилось, и решаем, продолжать ли."
  exit_criterion: "Первая база знаний, для правовой функции, используется; у её источников есть тот, кто их ведёт, и дата пересмотра."
  stop_threshold: "Источники остаются без того, кто их ведёт: такие знания в базу не берём."
checklist:
  - {item: "Договориться об общем подходе: источники, ведущий и дата пересмотра у каждого источника, доступ по классу данных, ответы со ссылкой на источник", state: "не начато"}
  - {item: "Вместе с каждой функцией составить перечень знаний, которые нужны её сотрудникам каждый день", state: "не начато"}
  - {item: "Ранжировать кандидатов по востребованности и выполнимости", state: "не начато"}
  - {item: "Создать первую базу знаний вместе с правовой функцией и начать вторую", state: "не начато"}
  - {item: "Записать выводы, полезные для следующих баз знаний", state: "не начато"}
live:

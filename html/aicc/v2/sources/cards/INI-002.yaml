id: INI-002
title: "Изучение ландшафта услуг"
summary: "Собираем в одну карту то, что функции Банка и владельцы услуг уже знают об услугах, и находим, где внедрение AI можно начать с наименьшим вмешательством в работу."
profile: initiative
class_of_service: инициатива
stage: Воронка
area: "Аналитика и поддержка решений"
people:
  business_owner: {position: "представитель функций и владельцев услуг, которым нужна карта ландшафта и перечень кандидатов", holder: ""}
  product_manager: {position: "менеджер продукта Хаба по этой теме", holder: ""}
  project_manager: {position: "кто ведёт проект", holder: ""}
outcome:
  problem: "Знания об услугах Банка распределены по подразделениям. Нет единого представления, которое связывало бы коммерческий портфель с процессами, приложениями и инфраструктурой, поэтому внедрение AI начинается там, откуда первым пришёл запрос."
  intended_outcome: "Портал ландшафта услуг, где каждая часть карты проверена её владельцем; перечень случаев, где AI уже применяется; ранжированный перечень кандидатов на внедрение AI."
  measure: "Число подразделений и услуг на карте и доля, проверенная их владельцами; число выявленных случаев применения AI; число ранжированных кандидатов."
  baseline: "Не измерено."
  target: "Не задано."
constraints:
  appetite: "Без отдельного бюджета: рабочее время того, кто ведёт проект."
  review_point: "К концу 2026 года: смотрим, что получилось, и решаем, продолжать ли."
  exit_criterion: "Первые подразделения и услуги показаны на карте и проверены их владельцами; портал открывается и показывает их."
  stop_threshold: "Владельцы услуг не находят времени проверить карту, и она остаётся неполной."
checklist:
  - {item: "Договориться об общем способе описания услуги: коммерческий портфель, услуги, процессы, организационная структура, приложения и данные, инфраструктура", state: "не начато"}
  - {item: "Собрать уже имеющиеся у подразделений документы, схемы и перечни, не создавая новых", state: "не начато"}
  - {item: "Свести собранное в репозиторий корпоративной архитектуры и открыть портал ландшафта", state: "не начато"}
  - {item: "Проверить каждую часть карты вместе с её владельцем", state: "не начато"}
  - {item: "Отметить на карте, где AI уже применяется и где рутинная, ручная или документоёмкая работа", state: "не начато"}
  - {item: "Превратить отмеченные места в ранжированный перечень кандидатов для бэклога", state: "не начато"}
  - {item: "Решить, кому и как открыт доступ к порталу: он показывает внутреннюю информацию Банка", state: "не начато"}
live:
  status: не задан
  next_step: "Договориться с подразделением корпоративной архитектуры об общем способе описания услуги."
  risks:
    - "Портал показывает внутреннюю информацию Банка: порядок доступа нужно продумать с информационной безопасностью."
    - "Карта описывает только текущее состояние; изменения услуг, процессов, систем и архитектуры в работу не входят."
  dependencies:
    - "Время и знания руководителей подразделений и владельцев услуг."
    - "Доступ к репозиторию корпоративной архитектуры и порталу, класс данных их содержимого."

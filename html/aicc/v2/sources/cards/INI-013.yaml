id: INI-013
title: "Решение клиентских обращений на основе клиентской аналитики"
summary: "Для одной группы клиентского обслуживания ассистент собирает подтверждённую историю нерешённого вопроса со ссылками на источники и предлагает следующий шаг; сотрудник проверяет результат и действует сам."
profile: initiative
class_of_service: инициатива
stage: Воронка
function: "Клиентское обслуживание"
area: build-and-run
people:
  business_owner: {position: "представитель клиентского обслуживания, которому нужен результат", holder: ""}
  product_manager: {position: "менеджер продукта Хаба по этой теме", holder: ""}
  project_manager: {position: "кто ведёт проект", holder: ""}
outcome:
  problem: "Сотрудники восстанавливают историю нерешённого вопроса вручную в нескольких системах: клиенты обращаются повторно, а на разбор уходит много времени."
  intended_outcome: "Меньше повторных обращений по одному нерешённому вопросу и меньше трудозатрат на восстановление истории. Сотрудники используют подтверждённое представление и записывают результат."
  measure: "Повторное обращение по подходящим кейсам в выбранный период; трудозатраты на разбор кейса; доля кейсов первых пользователей, где использовано представление и записан результат; по выбранному маршруту: время до подтверждённого урегулирования (платежи), лишние запросы статуса (споры) или повторные запросы информации (оформление)."
  baseline: "Не измерено."
  target: "Не задано."
constraints:
  appetite: "Один маршрут, одна очередь, одна группа клиентского обслуживания. Затраты и сроки пока не оценены."
  review_point: "После эксперимента на исторических данных и после первого пилота."
  exit_criterion: "Эксперимент на исторических данных только для чтения завершён отчётом о результатах; пилот в одной группе даёт материалы, по которым видно, продолжать ли."
  stop_threshold: "Не хватает подходящих кейсов, нет доступа к источникам или группа не может выделить время на проверку."
checklist:
  - {item: "Выбрать маршрут и очередь: платежи, карточные споры или оформление и проверка клиента; задать критерии подходящего, повторного и нерешённого кейса", state: "не начато"}
  - {item: "Получить исторические выгрузки только для чтения, оценить персональные данные и разметить кейсы вместе с экспертами", state: "не начато"}
  - {item: "Зафиксировать оценочный набор, статусы и действия, которые разрешены ассистенту", state: "не начато"}
  - {item: "Создать сервис контекста, ассистента и рабочее место; сравнить работу с AI и без него на кейсах, которые раньше не использовались", state: "не начато"}
  - {item: "Проверить сервис, провести приёмку и обучить одну группу до запуска", state: "не начато"}
  - {item: "Сопоставить результаты с существующим процессом", state: "не начато"}
live:
  status: не задан
  next_step: "Выбрать вместе с представителем клиентского обслуживания маршрут и очередь для пилота."
  risks:
    - "Персональные данные клиентов используются для подсказок сотруднику; у ассистента нет инструментов записи, каждую запись делает сотрудник."
    - "Нет интерфейсов чтения, общего ключа клиента или временных отметок; плохо читается русский, кыргызский и смешанный текст; мало подходящих кейсов; группа или тестировщик недоступны."
    - "Запасные варианты: сузить объём, взять одобренные выгрузки или оставить ручную обработку."
    - "Автоматические сообщения клиентам, движение средств, решения по кредитам, ценам, мошенничеству и возмещению, общий профиль клиента, чат-бот и корпоративная база знаний в работу не входят."
  dependencies:
    - "Источники и доступ, общие с INI-006 (обращения и трудности клиентов)."
    - "Представитель клиентского обслуживания и эксперты процесса."
    - "ИТ: доступ, рабочее место, интеграция, среда, изменения."
    - "Владелец платформы: размещение, шлюз, журналы, мониторинг."
    - "Проверка представителями контрольных функций."

id: INI-009
title: "Консультации и постановка задач"
summary: "Постоянная работа для небольших повторяющихся просьб функций Банка: консультации, разбор потребности, формулировка задачи и подхода. Каждая просьба идёт отдельной строкой в одну итерацию, без отдельной карточки проекта."
profile: run-rate
class_of_service: текущая работа
stage: Воронка
area: advise-and-formulate
people:
  business_owner: {position: "представитель функции, которая формулирует просьбы и принимает результат", holder: ""}
  product_manager: {position: "менеджер продукта Хаба по текущей работе", holder: ""}
  project_manager: {position: "кто ведёт очередь просьб", holder: ""}
outcome:
  problem: "У функций возникают небольшие повторяющиеся потребности: документ, эксплуатационная инструкция, обзор согласованности документов, сценарий или дайджест мониторинга. Оформлять под каждую отдельный проект слишком тяжело."
  intended_outcome: "Оперативная и понятная поддержка: по каждой просьбе записаны заказчик, приоритет, критерии приёмки и результат, а работа укладывается в одну итерацию."
  measure: "Доля запросов, взятых в итерацию и принятых до её конца; доля принятых запросов, где записаны переданный результат, выполненные критерии и дата."
  baseline: "Запросов в работе пока нет, доли не считаются."
  target: "Все взятые в работу запросы укладываются в итерацию и принимаются по критериям."
constraints:
  appetite: "Одна итерация на один запрос, из общей мощности команды Хаба."
  review_point: "Раз в неделю смотрим очередь и берём в работу запрос с наивысшим приоритетом, который помещается в итерацию."
  exit_criterion: "Заказчик принял результат по заранее названным критериям приёмки."
  stop_threshold: "Запрос не помещается в одну итерацию."
checklist:
  - {item: "Назван тот, кому нужен результат, и ожидаемая выгода", state: "не начато"}
  - {item: "Записаны критерии приёмки", state: "не начато"}
  - {item: "Если применяется AI: названа цель применения и класс данных", state: "не начато"}
  - {item: "Есть место в лимите работ в процессе и запрос помещается в одну итерацию", state: "не начато"}
  - {item: "Результат передан заказчику и принят по критериям", state: "не начато"}
live:
  status: не задан
  next_step: "Собрать первые просьбы функций по консультациям и постановке задач."
  risks:
    - "Запрос не помещается в одну итерацию: тогда оформляем его отдельным проектом."
    - "Общая мощность команды ограничена: срочный запрос меняет очерёдность, но не добавляет рук."
  dependencies:
    - "Свободное место в лимите работ в процессе."
    - "Представитель функции, которой нужен результат."
    - "Если применяется AI: проверка цели применения и класса данных."

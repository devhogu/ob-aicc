  what_en: "Federal policy changes with each administration; states pass AI laws to protect consumers."
  brief: "Федеральный курс на развитие и законы штатов о защите потребителей."
  brief_en: "A federal push for growth and state consumer-protection laws."
  for_us: Направление крупнейшего рынка моделей и сервисов, которые мы используем.
  for_us_en: "Where the largest market for the models and services we use is heading."
- id: oecd-ai-principles

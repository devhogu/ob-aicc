  what_en: "Regulation of banks and financial organizations, including their technology, data, and suppliers."
  brief: "Как регуляторы соседнего финтех-рынка подходят к AI в банках."
  brief_en: "How a neighboring fintech market’s regulators approach AI in banks."
  for_us: Надзорная практика соседнего рынка с самым развитым финтехом в регионе.
  for_us_en: "Supervisory practice in the neighboring market with the most developed fintech in the region."
- id: aifc
  group: Казахстан
  group_en: "Kazakhstan"
  weight: benchmark
  title: Международный финансовый центр «Астана»
  title_en: "Astana International Financial Centre (AIFC)"
  kind: Финансовый центр с собственным регулированием
  kind_en: "Financial center with its own regulation"
  what: Свои правила для финансовых услуг, данных и технологий и регуляторная «песочница».
  what_en: "Its own rules for financial services, data, and technology, and a regulatory sandbox."
  brief: "Финансовый центр со своими правилами и «песочницей» для экспериментов."
  brief_en: "A financial center with its own rules and a sandbox for experiments."
  for_us: Ориентир для экспериментов в регулируемой среде и возможная площадка для партнёров.
  for_us_en: "A reference point for experiments in a regulated environment and a possible venue for partners."
- id: ru-personal-data-law
  group: Российская Федерация
  group_en: "Russian Federation"
  weight: partners
  title: Федеральный закон «О персональных данных» (152-ФЗ)
  title_en: "Federal Law No. 152-FZ “On Personal Data”"
  title_ru_original: "Федеральный закон «О персональных данных» (152-ФЗ)"
  kind: Федеральный закон
  kind_en: "Federal law"
  what: Требует хранить персональные данные граждан России в базах данных на территории страны.
  what_en: "Requires the personal data of Russian citizens to be stored in databases located in Russia."
  brief: "Персональные данные в России; важен для партнёров и поставщиков."
  brief_en: "Personal data in Russia; matters for partners and suppliers."
  for_us: Важен при выборе поставщиков и партнёров, работающих с данными граждан России.
  for_us_en: "It matters when choosing suppliers and partners that work with the data of Russian citizens."
- id: ru-national-ai-strategy
  group: Российская Федерация
  group_en: "Russian Federation"
  weight: benchmark
  title: Национальная стратегия развития AI и экспериментальные правовые режимы
  title_en: "National AI development strategy and experimental legal regimes"
  kind: Указ Президента и федеральные законы
  kind_en: "Presidential decree and federal laws"
  what: Цели до 2030 года и режимы, в которых AI испытывают с временными исключениями из правил; с 1 сентября 2026 года действует первый федеральный закон об AI (243-ФЗ).
  what_en: "Goals to 2030, and regimes in which AI is tested under temporary exemptions from the rules; since 1 September 2026, the first federal AI law (No. 243-FZ) is in force."
  brief: "Стратегия до 2030 года, режимы испытаний и первый закон об AI."
  brief_en: "Strategy to 2030, test regimes and the first AI law."
  for_us: Влияет на регион и поставщиков; пример того, как устроить регулируемый эксперимент.
  for_us_en: "It affects the region and suppliers, and shows how to set up a regulated experiment."

  what_en: "The first intergovernmental standard for trustworthy AI."
  brief: "Пять принципов AI, заслуживающего доверия, — первый межгосударственный стандарт."
  brief_en: "Five principles of trustworthy AI — the first intergovernmental standard."
  for_us: Самое краткое изложение того, чего от применения AI будут ждать регулятор и инвестор.

# Regulators, acts and standards on AI and data, condensed from the v1 reference (portal/content/ru/reference/regulations).
# group: where it belongs; weight: applies (действует для нас), partners (касается партнёров и поставщиков), benchmark (ориентир).
- id: nbkr
  group: Кыргызская Республика
  group_en: "Kyrgyz Republic"
  weight: applies
  title: Национальный банк Кыргызской Республики
  title_en: "National Bank of the Kyrgyz Republic"
  kind: Центральный банк и банковский надзор
  kind_en: "Central bank and banking supervisor"
  what: Акты о банковской деятельности, информационной безопасности, аутсорсинге, операционном риске и платёжных системах.
  what_en: "Acts on banking, information security, outsourcing, operational risk, and payment systems."
  brief: "Надзор за банками: информационная безопасность, аутсорсинг, банковская тайна."
  brief_en: "Bank supervisor: information security, outsourcing, bank secrecy."
  for_us: Любое применение AI, которое затрагивает банковский процесс, данные клиентов или третьих лиц, подпадает под его требования.
  for_us_en: "Any use of AI that touches a banking process or the data of customers or third parties falls under its requirements."
- id: kg-digital-code
  group: Кыргызская Республика
  group_en: "Kyrgyz Republic"
  weight: applies
  title: Цифровой кодекс Кыргызской Республики
  title_en: "Digital Code of the Kyrgyz Republic"
  title_ru_original: "Цифровой кодекс Кыргызской Республики"
  kind: Кодекс
  kind_en: "Code"
  what: "Действует с февраля 2026 года и объединяет нормы о цифровых услугах, электронной подписи, биометрической идентификации, защите персональных данных и системах AI. Заменил закон 2008 года «Об информации персонального характера»."
  what_en: "In force since February 2026, it brings together the rules on digital services, electronic signatures, biometric identification, personal data protection, and AI systems. It replaced the 2008 Law “On Personal Information.”"
  brief: "Главный закон о данных и AI; по нему проверяем каждое решение с AI."
  brief_en: "The main law on data and AI; we check every AI solution against it."
  for_us: "Применяется к каждому решению с AI, которое работает с данными клиентов или работников: какие данные, для чего, с каким согласием и где обрабатывать; к самим системам AI — через требования к оценке их опасности."
  for_us_en: "It applies to every AI solution that works with customer or employee data: which data, for what purpose, with what consent, and where to process it. It applies to AI systems themselves through the requirements for assessing their hazard."
- id: kg-high-risk-ai-requirements
  group: Кыргызская Республика
  group_en: "Kyrgyz Republic"
  weight: applies
  title: Требования к оценке опасности систем AI и к системам повышенной опасности
  title_en: "Requirements for the hazard assessment of AI systems and for AI systems of increased hazard"
  title_ru_original: "Требования к оценке опасности систем AI и к системам повышенной опасности"
  kind: Постановление Кабинета Министров № 770 от 2 декабря 2025 года
  kind_en: "Cabinet of Ministers Resolution No. 770 of 2 December 2025"
  what: "Принято во исполнение Цифрового кодекса: методика оценки опасности систем AI, управление рисками систем повышенной опасности, их открытость, понятность, контролируемость, точность, надёжность, качество данных и техническая документация."
  what_en: "Adopted to implement the Digital Code: a method for assessing the hazard of AI systems; risk management for systems of increased hazard; and their transparency, understandability, controllability, accuracy, reliability, data quality, and technical documentation."
  brief: "Как владелец оценивает опасность системы AI и что делать с опасной."
  brief_en: "How an owner assesses an AI system’s hazard, and what to do if it is hazardous."
  for_us: Распространяется на владельцев систем AI независимо от формы собственности. Наши категории риска и проверки нужно сверять с этой методикой.
  for_us_en: "It applies to owners of AI systems, whatever their form of ownership. Our risk tiers and checks need to be compared with this method."
- id: kg-aml-body
  group: Кыргызская Республика
  group_en: "Kyrgyz Republic"
  weight: applies
  title: Противодействие отмыванию денег и финансированию терроризма
  title_en: "Anti-money laundering and countering the financing of terrorism"
  kind: Закон и орган финансовой разведки
  kind_en: "Law and financial intelligence unit"
  what: Изучение клиентов, мониторинг операций и сообщения о подозрительной деятельности. Надзор — Государственная служба финансовой разведки при Министерстве финансов.
  what_en: "Customer due diligence, transaction monitoring, and suspicious activity reports. Supervised by the State Financial Intelligence Service under the Ministry of Finance."
  brief: "Изучение клиентов и подозрительные операции; с AI проверки остаются."
  brief_en: "Customer due diligence and suspicious transactions; with AI the checks stay."
  for_us: AI в изучении клиентов, мониторинге и проверке по спискам сохраняет предусмотренные законом проверки и след решений.
  for_us_en: "Where AI is used in customer due diligence, monitoring, and list screening, the checks the law requires and the decision trail stay in place."
- id: kg-digital-development
  group: Кыргызская Республика
  group_en: "Kyrgyz Republic"
  weight: applies
  title: Цифровое развитие
  title_en: "Digital development"
  kind: Министерство, акты и программы
  kind_en: "Ministry, acts, and programs"
  what: Направление цифровизации страны, правила для государственных информационных систем и электронных услуг; проект положения об этике AI вынесен на общественное обсуждение в сентябре 2026 года.
  what_en: "The country’s digitalization agenda and the rules for government information systems and electronic services; a draft regulation on AI ethics was put out for public consultation in September 2026."
  brief: "Курс цифровизации страны; отсюда приходят новые правила об AI."
  brief_en: "The country’s digital agenda; new AI rules come from here."
  for_us: Задаёт рамки внедрения AI в стране и порядок взаимодействия с государством, в том числе в идентификации.
  for_us_en: "It sets the framework for AI adoption in the country and for working with the state, including on identification."
- id: kz-law-on-ai
  group: Казахстан
  group_en: "Kazakhstan"
  weight: benchmark
  title: Закон «Об искусственном интеллекте»
  title_en: "Law “On Artificial Intelligence”"
  title_ru_original: "Закон «Об искусственном интеллекте»"
  kind: Закон и национальная концепция
  kind_en: "Law and national concept"
  what: Первый в регионе специальный закон об AI с классификацией систем по риску.
  what_en: "The first dedicated AI law in the region, with a classification of systems by risk."
  brief: "Первый закон об AI в Центральной Азии, действует с января 2026 года."
  brief_en: "Central Asia’s first AI law, in force since January 2026."
  for_us: Пример соседней страны, с которым полезно сверять наш подход к категориям риска; касается партнёров, работающих в Казахстане.
  for_us_en: "A neighboring country’s example, useful for checking our approach to risk tiers; it concerns partners operating in Kazakhstan."
- id: kz-personal-data-law
  group: Казахстан
  group_en: "Kazakhstan"
  weight: partners
  title: Закон «О персональных данных и их защите»
  title_en: "Law “On Personal Data and Their Protection”"
  title_ru_original: "Закон «О персональных данных и их защите»"
  kind: Закон
  kind_en: "Law"
  what: Основания обработки, согласие, права субъектов, передача данных за рубеж и хранение отдельных данных в стране.
  what_en: "Legal grounds for processing, consent, the rights of data subjects, cross-border transfer, and in-country storage of certain data."
  brief: "Персональные данные в Казахстане; важен для партнёров и поставщиков."
  brief_en: "Personal data in Kazakhstan; matters for partners and suppliers."
  for_us: Касается партнёров и поставщиков, которые обрабатывают данные резидентов Казахстана.
  for_us_en: "It concerns partners and suppliers that process the data of Kazakhstan residents."
- id: kz-financial-regulators
  group: Казахстан
  group_en: "Kazakhstan"
  weight: benchmark
  title: Национальный Банк и Агентство по регулированию финансового рынка
  title_en: "National Bank of the Republic of Kazakhstan and the Agency of the Republic of Kazakhstan for Regulation and Development of the Financial Market"
  kind: Центральный банк и финансовый надзор
  kind_en: "Central bank and financial supervisor"

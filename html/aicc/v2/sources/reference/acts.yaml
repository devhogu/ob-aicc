  weight: benchmark
  title: Кодекс этики в сфере AI
  title_en: "AI Code of Ethics"
  kind: Добровольный отраслевой кодекс
  kind_en: "Voluntary industry code"
  what: Этические обязательства разработчиков и пользователей AI.
  what_en: "Ethical commitments of AI developers and users."
  brief: "Добровольный кодекс этики AI — общий язык отрасли региона."
  brief_en: "A voluntary AI ethics code — the region’s shared industry language."
  for_us: Ориентир этической практики на языке отрасли региона.
  for_us_en: "A reference point for ethical practice, in the language of the region’s industry."
- id: eu-ai-act
  group: Европейский союз
  group_en: "European Union"
  weight: benchmark
  title: Регламент ЕС об искусственном интеллекте (AI Act)
  title_en: "EU Artificial Intelligence Act (AI Act)"
  kind: Регламент ЕС
  kind_en: "EU regulation"
  what: "Обязанности по уровню риска: запрещённые практики, применения высокого риска, требования прозрачности."
  what_en: "Obligations by level of risk: prohibited practices, high-risk uses, and transparency requirements."
  brief: "Закон об AI по уровням риска; берём его логику для своих категорий."
  brief_en: "The AI law built on risk levels; we use its logic for our risk tiers."
  for_us: Поставщики строят продукты под него; его риск-ориентированная логика — основа наших категорий риска.
  for_us_en: "Suppliers build their products to meet it; its risk-based logic is the basis of our risk tiers."
- id: eu-gdpr
  group: Европейский союз
  group_en: "European Union"
  weight: benchmark
  title: Общий регламент по защите данных (GDPR)
  title_en: "General Data Protection Regulation (GDPR)"
  kind: Регламент ЕС
  kind_en: "EU regulation"
  what: Эталонный режим защиты персональных данных и образец для законов многих стран, в том числе региона.
  what_en: "The reference regime for personal data protection and the model for the laws of many countries, including those of the region."
  brief: "Европейский закон о данных — образец для законов региона и поставщиков."
  brief_en: "Europe’s data law — the model for the region’s laws and for suppliers."
  for_us: Законы региона опираются на те же понятия, а поставщики — на соответствие ему.
  for_us_en: "The region’s laws rest on the same concepts, and suppliers point to their compliance with it."
- id: eu-dora
  group: Европейский союз
  group_en: "European Union"
  weight: benchmark
  title: Цифровая операционная устойчивость (DORA)
  title_en: "Digital Operational Resilience Act (DORA)"

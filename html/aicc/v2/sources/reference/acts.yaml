  title_en: "Bank of Russia on AI in the financial market"
  kind: Доклады и рекомендации регулятора
  kind_en: "Regulator’s reports and recommendations"
  what: Позиция центрального банка о выгодах, рисках и регулировании AI в финансах.
  what_en: "The central bank’s position on the benefits, risks, and regulation of AI in finance."
  brief: "Мягкое регулирование AI в финансах, кодекс этики и безопасность."
  brief_en: "Soft regulation of AI in finance, a code of ethics and security."
  for_us: Практика крупнейшего соседнего рынка, которая, вероятно, повлияет на регуляторов региона.
  for_us_en: "Practice in the largest neighboring market, which is likely to influence the region’s regulators."

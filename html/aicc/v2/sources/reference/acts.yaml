  what_en: "The first treaty on AI: human rights, democracy, and the rule of law across the whole AI lifecycle."
  brief: "Первый обязательный договор об AI: права людей, которых затрагивает AI."
  brief_en: "The first binding AI treaty: rights of people affected by AI."
  for_us: Закрепляет ожидание, что у затронутых AI людей есть права и способы защиты.
  for_us_en: "It sets the expectation that people affected by AI have rights and remedies."

  kind_en: "EU regulation and EBA guidelines"
  what: Риски ИКТ, сообщения об инцидентах, тестирование устойчивости и риски третьих сторон.
  what_en: "ICT risk, incident reporting, resilience testing, and third-party risk."
  brief: "Риски ИТ, инциденты и поставщики финансовых организаций, включая AI."
  brief_en: "IT risk, incidents and suppliers of financial firms, AI included."
  for_us: Самый ясный пример того, чего надзор ждёт по инцидентам, устойчивости и поставщикам.
  for_us_en: "The clearest example of what supervisors expect on incidents, resilience, and suppliers."
- id: us-model-risk-and-consumer-guidance
  group: США
  group_en: "United States"
  weight: benchmark
  title: Модельный риск и AI в кредитовании
  title_en: "Model risk and AI in lending"
  kind: Надзорные рекомендации
  kind_en: "Supervisory guidance"
  what: Эталонная практика управления модельным риском (с апреля 2026 года — рекомендации SR 26-2 вместо SR 11-7); кредитное решение объясняют конкретно, какой бы ни была модель.
  what_en: "Best practice in model risk management (since April 2026, guidance SR 26-2 in place of SR 11-7); a credit decision must be explained in specific terms, whatever the model."
  brief: "Проверка моделей и объяснение отказа в кредите — образец для надзора."
  brief_en: "Model validation and explaining credit denials — a model for supervisors."
  for_us: Независимая проверка моделей и объяснимость кредитных решений — требования, которые встречаются у любого надзора.
  for_us_en: "Independent model review and explainable credit decisions are requirements you will find under any supervisor."
- id: us-federal-and-state-ai-policy
  group: США
  group_en: "United States"
  weight: benchmark
  title: Политика США в области AI
  title_en: "US AI policy"
  kind: Указы, правила закупок, законы штатов

# Regulators, acts and standards on AI and data, condensed from the v1 reference (portal/content/ru/reference/regulations).
# group: where it belongs; weight: applies (действует для нас), partners (касается партнёров и поставщиков), benchmark (ориентир).
- id: nbkr
  group: Кыргызская Республика
  weight: applies
  title: Национальный банк Кыргызской Республики
  kind: Центральный банк и банковский надзор
  what: Акты о банковской деятельности, информационной безопасности, аутсорсинге, операционном риске и платёжных системах.
  for_us: Любое применение AI, которое затрагивает банковский процесс, данные клиентов или третьих лиц, подпадает под его требования.
- id: kg-personal-information-law
  group: Кыргызская Республика
  weight: applies
  title: Закон «Об информации персонального характера»
  kind: Закон и уполномоченный орган
  what: Основания и цели обработки персональных данных, согласие, защита и передача данных.
  for_us: "Применяется к каждому решению с AI, которое работает с данными клиентов или работников: какие данные, для чего, с каким согласием и где обрабатывать."
- id: kg-aml-body
  group: Кыргызская Республика
  weight: applies
  title: Противодействие отмыванию денег и финансированию терроризма
  kind: Закон и орган финансовой разведки
  what: Изучение клиентов, мониторинг операций и сообщения о подозрительной деятельности.
  for_us: AI в изучении клиентов, мониторинге и проверке по спискам сохраняет предусмотренные законом проверки и след решений.
- id: kg-digital-development
  group: Кыргызская Республика
  weight: applies
  title: Цифровое развитие
  kind: Министерство, акты и программы
  what: Направление цифровизации страны, правила для государственных информационных систем и электронных услуг.
  for_us: Задаёт рамки внедрения AI в стране и порядок взаимодействия с государством, в том числе в идентификации.
- id: kz-law-on-ai
  group: Казахстан
  weight: benchmark
  title: Закон «Об искусственном интеллекте»
  kind: Закон и национальная концепция
  what: Первый в регионе специальный закон об AI с классификацией систем по риску.
  for_us: Возможный образец для будущего регулирования в Кыргызской Республике; касается партнёров, работающих в Казахстане.
- id: kz-personal-data-law
  group: Казахстан
  weight: partners
  title: Закон «О персональных данных и их защите»
  kind: Закон
  what: Основания обработки, согласие, права субъектов, передача данных за рубеж и хранение отдельных данных в стране.
  for_us: Касается партнёров и поставщиков, которые обрабатывают данные резидентов Казахстана.
- id: kz-financial-regulators
  group: Казахстан
  weight: benchmark
  title: Национальный Банк и Агентство по регулированию финансового рынка
  kind: Центральный банк и финансовый надзор
  what: Регулирование банков и финансовых организаций, в том числе их технологий, данных и поставщиков.
  for_us: Надзорная практика соседнего рынка с самым развитым финтехом в регионе.
- id: aifc
  group: Казахстан
  weight: benchmark
  title: Международный финансовый центр «Астана»
  kind: Финансовый центр с собственным регулированием
  what: Свои правила для финансовых услуг, данных и технологий и регуляторная «песочница».
  for_us: Ориентир для экспериментов в регулируемой среде и возможная площадка для партнёров.
- id: ru-personal-data-law
  group: Российская Федерация
  weight: partners
  title: Федеральный закон «О персональных данных» (152-ФЗ)
  kind: Федеральный закон
  what: Требует хранить персональные данные граждан России в базах данных на территории страны.
  for_us: Важен при выборе поставщиков и партнёров, работающих с данными граждан России.
- id: ru-national-ai-strategy
  group: Российская Федерация
  weight: benchmark
  title: Национальная стратегия развития AI и экспериментальные правовые режимы
  kind: Указ Президента и федеральные законы
  what: Цели до 2030 года и режимы, в которых AI испытывают с временными исключениями из правил.
  for_us: Влияет на регион и поставщиков; пример того, как устроить регулируемый эксперимент.
- id: bank-of-russia-on-ai
  group: Российская Федерация
  weight: benchmark
  title: Банк России об AI на финансовом рынке
  kind: Доклады и рекомендации регулятора
  what: Позиция центрального банка о выгодах, рисках и регулировании AI в финансах.
  for_us: Практика крупнейшего соседнего рынка, которая, вероятно, повлияет на регуляторов региона.
- id: ru-ai-code-of-ethics
  group: Российская Федерация
  weight: benchmark
  title: Кодекс этики в сфере AI
  kind: Добровольный отраслевой кодекс
  what: Этические обязательства разработчиков и пользователей AI.
  for_us: Ориентир этической практики на языке отрасли региона.
- id: eu-ai-act
  group: Европейский союз
  weight: benchmark
  title: Регламент ЕС об искусственном интеллекте (AI Act)
  kind: Регламент ЕС
  what: "Обязанности по уровню риска: запрещённые практики, применения высокого риска, требования прозрачности."
  for_us: Поставщики строят продукты под него; его риск-ориентированная логика — основа наших категорий риска.
- id: eu-gdpr
  group: Европейский союз
  weight: benchmark
  title: Общий регламент по защите данных (GDPR)
  kind: Регламент ЕС
  what: Эталонный режим защиты персональных данных и образец для законов многих стран, в том числе региона.
  for_us: Законы региона опираются на те же понятия, а поставщики — на соответствие ему.
- id: eu-dora
  group: Европейский союз
  weight: benchmark
  title: Цифровая операционная устойчивость (DORA)
  kind: Регламент ЕС и рекомендации EBA
  what: Риски ICT, сообщения об инцидентах, тестирование устойчивости и риски третьих сторон.
  for_us: Самый ясный пример того, чего надзор ждёт по инцидентам, устойчивости и поставщикам.
- id: us-model-risk-and-consumer-guidance
  group: США
  weight: benchmark
  title: Модельный риск и AI в кредитовании
  kind: Надзорные рекомендации
  what: Эталонная практика управления модельным риском; кредитное решение объясняют конкретно, какой бы ни была модель.
  for_us: Независимая проверка моделей и объяснимость кредитных решений — требования, которые встречаются у любого надзора.
- id: us-federal-and-state-ai-policy
  group: США
  weight: benchmark
  title: Политика США в области AI
  kind: Указы, правила закупок, законы штатов
  what: Федеральная политика меняется с администрацией; штаты принимают законы об AI для потребителей.
  for_us: Направление крупнейшего рынка моделей и сервисов, которые мы используем.
- id: oecd-ai-principles
  group: Международные принципы
  weight: benchmark
  title: Принципы ОЭСР в области AI
  kind: Межправительственные принципы
  what: Первый межправительственный стандарт AI, заслуживающего доверия.
  for_us: Самое краткое изложение того, чего от применения AI будут ждать регулятор и инвестор.
- id: unesco-recommendation-ethics-ai
  group: Международные принципы
  weight: benchmark
  title: Рекомендация ЮНЕСКО об этике AI
  kind: Документ международной организации
  what: Этика AI с точки зрения прав человека, достоинства, разнообразия и окружающей среды.
  for_us: Кыргызская Республика к ней присоединилась; на неё скорее всего сошлётся государственный орган.
- id: council-of-europe-ai-convention
  group: Международные принципы
  weight: benchmark
  title: Рамочная конвенция Совета Европы об AI
  kind: Международный договор
  what: "Первый договор об AI: права человека, демократия и верховенство права на всём жизненном цикле AI."
  for_us: Закрепляет ожидание, что у затронутых AI людей есть права и способы защиты.
- id: g7-hiroshima-ai-process
  group: Международные принципы
  weight: benchmark
  title: Хиросимский процесс G7
  kind: Добровольные обязательства разработчиков
  what: Принципы и кодекс поведения для создателей самых мощных моделей.
  for_us: Определяет, каких сведений о безопасности и прозрачности ждать от поставщиков моделей.
- id: financial-standard-setters-on-ai
  group: Международные принципы
  weight: benchmark
  title: FSB, Базельский комитет и BIS об AI
  kind: Доклады органов, задающих стандарты
  what: "Позиция органов, чьи стандарты внедряют национальные регуляторы: выгоды и риски AI для организаций и системы."
  for_us: По этим темам будут развиваться требования регуляторов региона; подготовиться заранее дешевле.
- id: nist-ai-rmf
  group: Стандарты и методологии
  weight: benchmark
  title: NIST AI Risk Management Framework
  kind: Добровольная методология
  what: Характеристики AI, заслуживающего доверия, и работа с рисками по шагам, с отдельным профилем для генеративного AI.
  for_us: Самая практичная методология; на неё мы опираемся, объясняя категории риска и точки контроля.
- id: iso-iec-ai-standards
  group: Стандарты и методологии
  weight: benchmark
  title: Стандарты ISO/IEC по AI (в том числе 42001)
  kind: Международные стандарты
  what: "Система менеджмента AI: политика, роли, оценка рисков, контроль и улучшение."
  for_us: По ним партнёр или регулятор, скорее всего, оценит, насколько полно устроено управление AI.
- id: owasp-top-10-llm
  group: Стандарты и методологии
  weight: benchmark
  title: OWASP Top 10 для приложений на больших языковых моделях
  kind: Перечень рисков безопасности
  what: "Десять главных рисков приложений на больших языковых моделях: промпт-инъекции, утечки, избыточные права и другие."
  for_us: Список атак, которые нужно уметь проверять в решениях с генеративным AI.

- id: funnel
  ru: воронка
  en: funnel
  definition: "Входной уровень: здесь собраны все предложения и потребности, пока их не разобрали и не выбрали, что делать дальше."
- id: portfolio
  ru: портфель
  en: portfolio
  definition: "Уровень, на котором выбранные предложения превращаются в инициативы и получают место в очереди на работу."
- id: program
  ru: программа
  en: program
  definition: "Уровень, на котором инициативы раскладываются на возможности и функции, а работа идёт короткими итерациями."
- id: project-card
  ru: карточка проекта
  en: project card
  definition: "Живая запись о проекте: что делаем, зачем, кто отвечает, на каком этапе. Её ведёт руководитель проекта, сайт показывает её как есть."
- id: project-profile
  ru: профиль проекта
  en: project profile
  definition: "Готовое описание вида работы: как он устроен, какие этапы проходит, что нужно на входе и на выходе."
- id: run-rate
  ru: текущая работа
  en: run-rate work
  definition: "Небольшая повторяющаяся работа, которая выполняется в рамках одной итерации по понятному шаблону."

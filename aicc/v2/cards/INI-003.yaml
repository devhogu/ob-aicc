id: INI-003
title: "AI в ежедневной работе функций"
summary: "Помогаем функциям найти рутинные задачи с файлами и отчётами, которые может взять на себя генеративный AI, и учим сотрудников работать с ассистентом на их собственных задачах."
profile: initiative
class_of_service: инициатива
stage: Воронка
function: "Комплаенс, HR, правовая функция, финансы и бухгалтерский учёт"
area: enablement
people:
  business_owner: {position: "представитель каждой из функций, которой нужен результат", holder: ""}
  product_manager: {position: "менеджер продукта Хаба по этой теме", holder: ""}
  project_manager: {position: "кто ведёт проект", holder: ""}
outcome:
  problem: "Функции тратят время на рутину с файлами и отчётами: черновики документов, краткие изложения, сравнение, извлечение сведений, подготовка отчётности. Часть функций не пользуется даже базовым ассистентом."
  intended_outcome: "Для каждой функции есть ранжированный перечень рутинных задач, первое практическое применение ассистента с обучением на рабочем месте и рекомендации, как работать дальше."
  measure: "Число ранжированных задач по каждой функции; число сотрудников, прошедших обучение и пользующихся ассистентом каждую неделю; число задач, переведённых на ассистента, и высвобожденное время по оценке функции."
  baseline: "Не измерено."
  target: "Не задано."
constraints:
  appetite: "Без отдельного бюджета: рабочее время того, кто ведёт проект."
  review_point: "К концу 2026 года: смотрим, что получилось, и решаем, продолжать ли."
  exit_criterion: "Одна функция работает с ассистентом над своими ранжированными задачами, сотрудники прошли обучение на рабочем месте."
  stop_threshold: "Допустимые классы данных не удаётся определить, и ассистенту нечего показать на реальных задачах."
checklist:
  - {item: "Встретиться с каждой функцией и разобрать её ежедневную и ежемесячную работу", state: "не начато"}
  - {item: "Вместе с функцией ранжировать задачи по высвобождаемому времени и по риску", state: "не начато"}
  - {item: "Познакомить функции, которые ещё не применяют AI, с ассистентом и обучить сотрудников на их собственных задачах", state: "не начато"}
  - {item: "Определить вместе с владельцами функций, какие классы данных можно использовать при работе с ассистентом", state: "не начато"}
  - {item: "Подвести итог: что дало результат, а что нет; внести ранжированные задачи в бэклог", state: "не начато"}
live:
  status: не задан
  next_step: "Назначить встречи с функциями и начать разбор их рутинной работы."
  risks:
    - "Кадровые данные и данные комплаенса конфиденциальны или персональны: классы данных нужно определить до начала работы с ассистентом."
    - "Автоматизация принятия решений и использование неподходящих классов данных в работу не входят."
  dependencies:
    - "Ранжированный перечень кандидатов из INI-002."
    - "Представители функций, которые определяют задачи и допустимые классы данных."
    - "Проверка результата представителями контрольных функций."

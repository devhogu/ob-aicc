id: INI-003
title: "AI в ежедневной работе функций"
title_en: "AI in the everyday work of functions"
summary: "Помогаем функциям найти рутинные задачи с файлами и отчётами, которые может взять на себя генеративный AI, и учим сотрудников работать с ассистентом на их собственных задачах."
summary_en: "We help functions find routine tasks with files and reports that generative AI can take on, and teach employees to work with the assistant on their own tasks."
profile: initiative
class_of_service: инициатива
stage: Воронка
function: "Комплаенс, HR, правовая функция, финансы и бухгалтерский учёт"
function_en: "Compliance, HR, legal function, finance and accounting"
area: "Обучение и внедрение"
area_en: "Enablement"
people:
  business_owner: {position: "представитель каждой из функций, которой нужен результат", position_en: "a representative of each function that needs the result", holder: ""}
  product_manager: {position: "менеджер продукта Хаба по этой теме", position_en: "the Hub's product manager for this topic", holder: ""}
  project_manager: {position: "кто ведёт проект", position_en: "whoever runs the project", holder: ""}
outcome:
  problem: "Функции тратят время на рутину с файлами и отчётами: черновики документов, краткие изложения, сравнение, извлечение сведений, подготовка отчётности. Часть функций не пользуется даже базовым ассистентом."
  problem_en: "Functions spend time on routine work with files and reports: drafting documents, summaries, comparisons, extracting information, preparing reports. Some functions do not use even a basic assistant."
  intended_outcome: "Для каждой функции есть ранжированный перечень рутинных задач, первое практическое применение ассистента с обучением на рабочем месте и рекомендации, как работать дальше."
  intended_outcome_en: "Each function has a ranked list of routine tasks, a first practical use of the assistant with on-the-job training, and recommendations on how to continue."
  measure: "Число ранжированных задач по каждой функции; число сотрудников, прошедших обучение и пользующихся ассистентом каждую неделю; число задач, переведённых на ассистента, и высвобожденное время по оценке функции."
  measure_en: "Number of ranked tasks for each function; number of employees who have been trained and use the assistant every week; number of tasks moved to the assistant and the time freed up, as estimated by the function."
  baseline: "Не измерено."
  baseline_en: "Not measured."
  target: "Не задано."
  target_en: "Not set."
constraints:
  appetite: "Без отдельного бюджета: рабочее время того, кто ведёт проект."
  appetite_en: "No separate budget: the working time of whoever runs the project."
  review_point: "К концу 2026 года: смотрим, что получилось, и решаем, продолжать ли."
  review_point_en: "By the end of 2026: we look at what has come of it and decide whether to continue."
  exit_criterion: "Одна функция работает с ассистентом над своими ранжированными задачами, сотрудники прошли обучение на рабочем месте."
  exit_criterion_en: "One function works with the assistant on its ranked tasks, and its employees have had on-the-job training."
  stop_threshold: "Допустимые классы данных не удаётся определить, и ассистенту нечего показать на реальных задачах."
  stop_threshold_en: "The permitted data classes cannot be defined, and the assistant has nothing to show on real tasks."
checklist:
  - {item: "Встретиться с каждой функцией и разобрать её ежедневную и ежемесячную работу", item_en: "Meet each function and go through its daily and monthly work", state: "не начато"}
  - {item: "Вместе с функцией ранжировать задачи по высвобождаемому времени и по риску", item_en: "Rank the tasks together with the function by time freed up and by risk", state: "не начато"}
  - {item: "Познакомить функции, которые ещё не применяют AI, с ассистентом и обучить сотрудников на их собственных задачах", item_en: "Introduce the assistant to functions that do not use AI yet, and train employees on their own tasks", state: "не начато"}
  - {item: "Определить вместе с владельцами функций, какие классы данных можно использовать при работе с ассистентом", item_en: "Define together with the function owners which data classes may be used when working with the assistant", state: "не начато"}
  - {item: "Подвести итог: что дало результат, а что нет; внести ранжированные задачи в бэклог", item_en: "Sum up what worked and what did not; add the ranked tasks to the backlog", state: "не начато"}
live:
  status: не задан
  next_step: "Назначить встречи с функциями и начать разбор их рутинной работы."
  next_step_en: "Schedule meetings with the functions and start going through their routine work."
  risks:
    - "Кадровые данные и данные комплаенса конфиденциальны или персональны: классы данных нужно определить до начала работы с ассистентом."
    - "Автоматизация принятия решений и использование неподходящих классов данных в работу не входят."
  risks_en:
    - "HR and Compliance data are confidential or personal: the data classes must be defined before work with the assistant begins."
    - "Automating decisions and using unsuitable data classes are out of scope."
  dependencies:
    - "Ранжированный перечень кандидатов из INI-002."
    - "Представители функций, которые определяют задачи и допустимые классы данных."
    - "Проверка результата представителями контрольных функций."
  dependencies_en:
    - "The ranked list of candidates from INI-002."
    - "Representatives of the functions who define the tasks and the permitted data classes."
    - "Review of the result by representatives of the control functions."

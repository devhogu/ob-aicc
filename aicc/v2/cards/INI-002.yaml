id: INI-002
title: "Изучение ландшафта услуг"
title_en: "Exploring the service landscape"
summary: "Собираем в одну карту то, что функции Банка и владельцы услуг уже знают об услугах, и находим, где внедрение AI можно начать с наименьшим вмешательством в работу."
summary_en: "We bring together on one map what the Bank's functions and service owners already know about their services, and find where AI adoption can start with the least disruption to the work."
profile: initiative
class_of_service: инициатива
stage: Воронка
area: "Аналитика и поддержка решений"
area_en: "Analytics and decision support"
people:
  business_owner: {position: "представитель функций и владельцев услуг, которым нужна карта ландшафта и перечень кандидатов", position_en: "a representative of the functions and service owners who need the landscape map and the list of candidates", holder: ""}
  product_manager: {position: "менеджер продукта Хаба по этой теме", position_en: "the Hub's product manager for this topic", holder: ""}
  project_manager: {position: "кто ведёт проект", position_en: "whoever runs the project", holder: ""}
outcome:
  problem: "Знания об услугах Банка распределены по подразделениям. Нет единого представления, которое связывало бы коммерческий портфель с процессами, приложениями и инфраструктурой, поэтому внедрение AI начинается там, откуда первым пришёл запрос."
  problem_en: "Knowledge about the Bank's services is spread across departments. There is no single view that links the commercial portfolio with processes, applications, and infrastructure, so AI adoption starts wherever the first request came from."
  intended_outcome: "Портал ландшафта услуг, где каждая часть карты проверена её владельцем; перечень случаев, где AI уже применяется; ранжированный перечень кандидатов на внедрение AI."
  intended_outcome_en: "A service landscape portal where every part of the map has been checked by its owner; a list of cases where AI is already used; a ranked list of candidates for AI adoption."
  measure: "Число подразделений и услуг на карте и доля, проверенная их владельцами; число выявленных случаев применения AI; число ранжированных кандидатов."
  measure_en: "Number of departments and services on the map and the share checked by their owners; number of AI use cases found; number of ranked candidates."
  baseline: "Не измерено."
  baseline_en: "Not measured."
  target: "Не задано."
  target_en: "Not set."
constraints:
  appetite: "Без отдельного бюджета: рабочее время того, кто ведёт проект."
  appetite_en: "No separate budget: the working time of whoever runs the project."
  review_point: "К концу 2026 года: смотрим, что получилось, и решаем, продолжать ли."
  review_point_en: "By the end of 2026: we review the results and decide whether to continue."
  exit_criterion: "Первые подразделения и услуги показаны на карте и проверены их владельцами; портал открывается и показывает их."
  exit_criterion_en: "The first departments and services are shown on the map and checked by their owners; the portal opens and shows them."
  stop_threshold: "Владельцы услуг не находят времени проверить карту, и она остаётся неполной."
  stop_threshold_en: "Service owners cannot find the time to check the map, and it stays incomplete."
checklist:
  - {item: "Договориться об общем способе описания услуги: коммерческий портфель, услуги, процессы, организационная структура, приложения и данные, инфраструктура", item_en: "Agree on a common way to describe a service: commercial portfolio, services, processes, organizational structure, applications and data, infrastructure", state: "не начато"}
  - {item: "Собрать уже имеющиеся у подразделений документы, схемы и перечни, не создавая новых", item_en: "Collect the documents, diagrams, and lists that departments already have, without creating new ones", state: "не начато"}
  - {item: "Свести собранное в репозиторий корпоративной архитектуры и открыть портал ландшафта", item_en: "Bring what was collected into the enterprise architecture repository and open the landscape portal", state: "не начато"}
  - {item: "Проверить каждую часть карты вместе с её владельцем", item_en: "Check each part of the map together with its owner", state: "не начато"}
  - {item: "Отметить на карте, где AI уже применяется и где рутинная, ручная или документоёмкая работа", item_en: "Mark on the map where AI is already used and where the work is routine, manual, or document-heavy", state: "не начато"}
  - {item: "Превратить отмеченные места в ранжированный перечень кандидатов для бэклога", item_en: "Turn the marked places into a ranked list of candidates for the backlog", state: "не начато"}
  - {item: "Решить, кому и как открыт доступ к порталу: он показывает внутреннюю информацию Банка", item_en: "Decide who gets access to the portal and how: it shows the Bank's internal information", state: "не начато"}
live:
  status: не задан
  next_step: "Договориться с подразделением корпоративной архитектуры об общем способе описания услуги."
  next_step_en: "Agree with the enterprise architecture department on a common way to describe a service."
  risks:
    - "Портал показывает внутреннюю информацию Банка: порядок доступа нужно продумать с информационной безопасностью."
    - "Карта описывает только текущее состояние; изменения услуг, процессов, систем и архитектуры в работу не входят."
  risks_en:
    - "The portal shows the Bank's internal information: access rules need to be worked out with information security."
    - "The map describes the current state only; changes to services, processes, systems, and architecture are out of scope."
  dependencies:
    - "Время и знания руководителей подразделений и владельцев услуг."
    - "Доступ к репозиторию корпоративной архитектуры и порталу, класс данных их содержимого."
  dependencies_en:
    - "The time and knowledge of department heads and service owners."
    - "Access to the enterprise architecture repository and the portal, and the data class of their content."
decisions: []

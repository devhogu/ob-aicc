outcome:
  problem: Сотрудники HR тратят много времени на подготовку повторяющихся отчётов и заполнение типовых форм вручную.
  problem_en: "HR staff spend a lot of time preparing recurring reports and filling in standard forms by hand."
  intended_outcome: Черновики типовых отчётов и форм готовит ассистент Claude на рабочем месте каждого сотрудника, а сотрудник проверяет результат и использует его.
  intended_outcome_en: "Drafts of standard reports and forms are prepared by the Claude assistant on each employee's computer, and the employee checks the result and uses it."
  measure: Время подготовки типового отчёта или формы.
  measure_en: "Time to prepare a standard report or form."
  baseline: Не измерено.
  baseline_en: "Not measured."
  target: Не задано.
  target_en: "Not set."
constraints:
  appetite: Одна итерация на один вид отчёта или формы.
  appetite_en: "One iteration per type of report or form."
  review_point: После трёх готовых шаблонов.
  review_point_en: "After three finished templates."
  exit_criterion: Сотрудник получает черновик, который можно использовать после проверки.
  exit_criterion_en: "The employee gets a draft that can be used after checking."
  stop_threshold: Проверка результата занимает столько же времени, сколько подготовка вручную.
  stop_threshold_en: "Checking the result takes as long as preparing it by hand."
checklist:

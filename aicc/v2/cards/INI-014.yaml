title_en: "HR: standard reports and forms prepared by a workspace assistant"
summary: "Берём на себя рутину в функции HR: помощник на рабочем месте сотрудника готовит черновики типовых отчётов и заполняет типовые формы."
summary_en: "We take routine work off the HR function: an assistant on the employee's computer drafts standard reports and fills in standard forms."
profile: run-rate

  problem: Сотрудники комплаенс тратят много времени на подготовку регулярной отчётности и заполнение типовых форм вручную.
  problem_en: "Compliance staff spend a lot of time preparing regular reports and filling in standard forms by hand."
  intended_outcome: Черновики регулярной отчётности и форм готовит ассистент Claude на рабочем месте каждого сотрудника, а сотрудник проверяет результат и использует его.
  intended_outcome_en: "Drafts of regular reports and forms are prepared by the Claude assistant on each employee's computer, and the employee checks the result and uses it."

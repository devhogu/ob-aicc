  appetite: Одна итерация на один вид отчёта или формы.
  appetite_en: "One iteration per type of report or form."
  review_point: После трёх готовых шаблонов.
  review_point_en: "After three finished templates."
  exit_criterion: Сотрудник получает черновик, который можно использовать после проверки.
  exit_criterion_en: "The employee gets a draft that can be used after checking."
  stop_threshold: Проверка результата занимает столько же времени, сколько подготовка вручную.
  stop_threshold_en: "Checking the result takes as long as preparing it by hand."

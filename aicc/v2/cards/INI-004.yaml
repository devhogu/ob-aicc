  business_owner: {position: "представитель функции FP&A, которой нужен результат", holder: ""}
  product_manager: {position: "менеджер продукта Хаба по этой теме", holder: ""}
  project_manager: {position: "кто ведёт проект", holder: ""}
outcome:
  problem: "FP&A уже готовит отчёты с применением AI, но отчётность различается от периода к периоду, зависит от ручных операций и не имеет общего канала для руководства Банка."
  intended_outcome: "Портал для руководства запущен с первым ежемесячным выпуском; конвейер на основе AI-агентов один раз полностью подготовил выпуск; определения показателей сходятся у FP&A, форма квартального выпуска готова."
  measure: "Число выпусков, предоставленных в срок; доля значений со ссылкой на контролируемый источник; число устранённых ручных операций; часы на подготовку выпуска; число определённых показателей."
  baseline: "Не измерено."
  target: "Не задано."
constraints:
  appetite: "Без отдельного бюджета: рабочее время того, кто ведёт проект."
  review_point: "К концу 2026 года: смотрим, что получилось, и решаем, продолжать ли."
  exit_criterion: "Ежемесячный выпуск один раз подготовлен конвейером и предоставлен через портал."
  stop_threshold: "Значения выпуска не удаётся подтвердить ссылкой на контролируемый источник."

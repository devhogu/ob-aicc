id: INI-004
title: "FP&A: отчётность по финансовым показателям для руководства Банка"
summary: "Готовим отчётность FP&A единым автоматизированным конвейером и показываем её руководству Банка через единый портал: одинаково каждый месяц и каждый квартал."
profile: initiative
class_of_service: инициатива
stage: Воронка
function: "FP&A"
area: "Управленческая отчётность и материалы для инвесторов"

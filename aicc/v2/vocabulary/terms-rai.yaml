- id: responsible-ai
  ru: ответственный AI
  en: responsible AI
  term_en: "responsible AI"
  definition: "Принципы и практики, благодаря которым тот, кто применяет AI, отвечает за то, что делает AI, и может ручаться за его результат."
  definition_en: "Principles and practices that make whoever uses AI accountable for what the AI does and able to vouch for its results."

- id: machine-learning
  ru: машинное обучение
  en: machine learning
  term_en: "machine learning"
  definition: "Способ построить модель на примерах, а не прописывать её правила: модель находит закономерность в примерах и применяет её к новым случаям."
  definition_en: "A way to build a model from examples rather than by writing out its rules: the model finds a pattern in the examples and applies it to new cases."

- id: llm
  ru: большая языковая модель
  en: LLM
  term_en: "LLM"
  definition: "Модель, обученная на очень больших массивах текста предсказывать следующий фрагмент текста. Основа генеративного AI для работы с языком."
  definition_en: "Large language model: a model trained on very large amounts of text to predict the next piece of text. The basis of generative AI for working with language."

- id: generative-ai
  ru: генеративный AI
  en: generative AI
  term_en: "generative AI"
  definition: "AI, который создаёт содержание: текст, изображения, программный код, аудио, а не только прогноз или класс."
  definition_en: "AI that creates content, such as text, images, program code, or audio, rather than only a forecast or a class."

- id: foundation-model
  ru: базовая модель
  en: foundation model
  term_en: "foundation model"
  definition: "Крупная модель общего назначения, которую обучают для широкого круга задач, а затем адаптируют к конкретным."
  definition_en: "A large general-purpose model that is trained for a wide range of tasks and then adapted to specific ones."

- id: ai-agent
  ru: AI-агент
  en: AI agent
  term_en: "AI agent"
  definition: "Система, в которой модель планирует и действует ради цели с помощью инструментов: получает данные, вызывает сервисы, заполняет формы, выполняет код."
  definition_en: "A system in which a model plans and acts toward a goal using tools: it gets data, calls services, fills in forms, and runs code."

- id: fine-tuning
  ru: дообучение
  en: fine-tuning
  term_en: "fine-tuning"
  definition: "Дополнительное обучение готовой модели на данных конкретной задачи или организации."
  definition_en: "Additional training of an existing model on the data of a specific task or organization."

- id: prompt
  ru: запрос к модели
  en: prompt
  term_en: "prompt"
  definition: "Инструкции и контекст, которые модель получает в момент использования. Системный запрос задаёт разработчик, и он действует постоянно."
  definition_en: "The instructions and context a model receives at the moment it is used. The system prompt is set by the developer and applies all the time."

- id: context-window
  ru: контекстное окно
  en: context window
  term_en: "context window"
  definition: "Объём текста, который модель учитывает одновременно. Того, что в него не поместилось, модель не видит."
  definition_en: "The amount of text a model takes into account at once. Whatever doesn’t fit, the model doesn’t see."

- id: token
  ru: токен
  en: token
  term_en: "token"
  definition: "Единица текста, с которой работает языковая модель: слово или его часть. В токенах считают затраты и лимиты."
  definition_en: "The unit of text a language model works with: a word or part of one. Costs and limits are counted in tokens."

- id: embedding
  ru: эмбеддинг
  en: embedding
  term_en: "embedding"
  definition: "Числовое представление текста, по которому система находит фрагменты, близкие к вопросу по смыслу. Такие представления хранят в векторном хранилище."
  definition_en: "A numerical representation of text that lets a system find passages close in meaning to a question. Such representations are kept in a vector store."

- id: grounding
  ru: опора на источники
  en: grounding
  term_en: "grounding"
  definition: "Привязка ответов модели к проверенным источникам, чтобы каждый ответ можно было перепроверить."
  definition_en: "Tying a model’s answers to verified sources, so that every answer can be checked."

- id: evaluation-set
  ru: оценочный набор
  en: evaluation set
  term_en: "evaluation set"
  definition: "Набор случаев из практики с ожидаемыми результатами. По нему проверяют решение до запуска и после каждого заметного изменения."
  definition_en: "A set of real-world cases with expected results. A solution is checked against it before launch and after every noticeable change."

- id: benchmark
  ru: эталонный тест
  en: benchmark
  term_en: "benchmark"
  definition: "Стандартная оценка для сравнения моделей. Помогает выбрать модель, но ничего не говорит о том, как она справится с вашей задачей."
  definition_en: "A standard test for comparing models. It helps you choose a model but says nothing about how it will handle your task."

- id: guardrails
  ru: защитные механизмы
  en: guardrails
  term_en: "guardrails"
  definition: "Правила, фильтры и ограничения вокруг модели: на что ей можно отвечать, на что нельзя и какие действия ей разрешены."
  definition_en: "Rules, filters, and limits around a model: what it may and may not answer, and which actions it is allowed to take."

- id: human-on-the-loop
  ru: человек над контуром
  en: human on the loop
  term_en: "human on the loop"
  definition: "Подход, при котором человек не подтверждает каждое действие AI, но наблюдает за системой и может вмешаться и остановить её."
  definition_en: "An approach in which a person does not confirm every AI action but watches the system and can step in and stop it."

- id: model-gateway
  ru: шлюз доступа к моделям
  en: model gateway
  term_en: "model gateway"
  definition: "Единая точка доступа к моделям: маршрутизация запросов, учёт затрат, журналы и защита данных в одном месте."
  definition_en: "A single point of access to models: request routing, cost tracking, logs, and data protection in one place."

- id: tool-gateway
  ru: шлюз доступа к инструментам
  en: tool gateway
  term_en: "tool gateway"
  definition: "Точка, через которую система AI получает доступ к информационным системам и сервисам, с отдельными правами и ограничениями для каждого инструмента."
  definition_en: "The point through which an AI system gets access to information systems and services, with separate permissions and limits for each tool."

- id: hallucination
  ru: галлюцинация
  en: hallucination
  term_en: "hallucination"
  definition: "Гладкий, уверенный и ошибочный результат модели: несуществующий факт, число или ссылка. Её ещё называют конфабуляцией."
  definition_en: "A smooth, confident, and wrong model output: a fact, figure, or reference that doesn’t exist. It is also called confabulation."

- id: bias
  ru: предвзятость
  en: bias
  term_en: "bias"
  definition: "Систематическая несправедливость результатов, усвоенная из данных или заложенная при проектировании."
  definition_en: "Systematic unfairness in results, learned from the data or built in during design."

- id: model-drift
  ru: дрейф
  en: drift
  term_en: "drift"
  definition: "Ухудшение качества модели по мере того, как жизнь уходит всё дальше от данных, на которых модель обучена."
  definition_en: "A decline in a model’s quality as the real world moves further away from the data the model was trained on."

- id: prompt-injection
  ru: промпт-инъекция
  en: prompt injection
  term_en: "prompt injection"
  definition: "Текст во входных данных, который модель выполняет как инструкцию вопреки замыслу разработчика. Он может быть спрятан в документе, письме или веб-странице."
  definition_en: "Text in the input that the model carries out as an instruction, against the developer’s intent. It can be hidden in a document, an email, or a web page."

- id: data-leakage
  ru: утечка данных
  en: data leakage
  term_en: "data leakage"
  definition: "Попадание данных туда, где их быть не должно: в обучающий набор поставщика, в ответ другому пользователю, в журнал."
  definition_en: "Data ending up where it shouldn’t be: in a vendor’s training set, in an answer to another user, or in a log."

- id: jailbreak
  ru: обход защитных ограничений
  en: jailbreak
  term_en: "jailbreak"
  definition: "Специально составленные входные данные, которые заставляют модель игнорировать её защитные механизмы."
  definition_en: "Specially crafted input that makes a model ignore its guardrails."

- id: data-poisoning
  ru: отравление данных
  en: data poisoning
  term_en: "data poisoning"
  definition: "Намеренное искажение данных, на которых учится модель, или документов, из которых она берёт сведения, чтобы изменить её поведение."
  definition_en: "Deliberately corrupting the data a model learns from, or the documents it draws information from, to change its behavior."

- id: excessive-agency
  ru: избыточная самостоятельность
  en: excessive agency
  term_en: "excessive agency"
  definition: "Ситуация, когда у AI-агента больше функций, прав доступа или автономности, чем нужно для его задачи."
  definition_en: "A situation in which an AI agent has more functions, access rights, or autonomy than its task needs."

- id: overreliance
  ru: чрезмерное доверие
  en: overreliance
  term_en: "over-reliance"
  definition: "Пользователи принимают результаты AI, не перепроверяя их, потому что система обычно права."
  definition_en: "Users accept AI results without checking them, because the system is usually right."

- id: model-collapse
  ru: коллапс модели
  en: model collapse
  term_en: "model collapse"
  definition: "Деградация моделей, которые всё больше учатся на содержании, созданном другими моделями."
  definition_en: "The degradation of models that learn more and more from content created by other models."

- id: risk-based-approach
  ru: риск-ориентированный подход
  en: risk-based approach
  term_en: "risk-based approach"
  definition: "Принцип, при котором объём проверок и мер контроля соразмерен риску применения."
  definition_en: "The principle that the extent of checks and controls is proportionate to the risk of the use."

- id: high-risk-ai
  ru: AI высокого риска
  en: high-risk AI
  term_en: "high-risk AI"
  definition: "Применения AI, которые закон относит к высокому риску, например кредитный скоринг физических лиц в Регламенте ЕС об AI. К ним предъявляется полный набор требований."
  definition_en: "Uses of AI that the law classes as high risk, such as credit scoring of individuals under the EU AI Act. They must meet the full set of requirements."

- id: model-risk-management
  ru: управление модельным риском
  en: model risk management
  term_en: "model risk management"
  definition: "Банковская практика валидации, документирования и мониторинга моделей. Управление AI распространяет её на новые виды систем."
  definition_en: "The banking practice of validating, documenting, and monitoring models. AI governance extends it to new kinds of systems."

- id: independent-review
  ru: независимая проверка
  en: independent review
  term_en: "independent review"
  definition: "Проверка решения человеком, который не участвовал в его разработке. В средней и высокой категориях риска её проводят вместе со специалистами по рискам, безопасности и правовым вопросам."
  definition_en: "A review of a solution by a person who was not involved in building it. In the medium and high risk tiers, it is done together with risk, security, and legal specialists."

- id: explainability
  ru: объяснимость
  en: explainability
  term_en: "explainability"
  definition: "Способность объяснить, почему система выдала такой результат, так, чтобы затронутый человек, надзорный орган или аудитор мог на это объяснение опереться."
  definition_en: "The ability to explain why a system produced a given result, in a way that the affected person, a supervisor, or an auditor can rely on."

- id: impact-assessment
  ru: оценка воздействия
  en: impact assessment
  term_en: "impact assessment"
  definition: "Оценка того, как применение AI с повышенным риском повлияет на людей и их права. Её делают до запуска."
  definition_en: "An assessment of how a higher-risk use of AI will affect people and their rights. It is done before launch."

- id: model-card
  ru: карточка модели
  en: model card
  term_en: "model card"
  definition: "Короткое описание модели или системы: что это, для чего она, как её тестировали и в каких случаях её не следует использовать."
  definition_en: "A short description of a model or system: what it is, what it is for, how it was tested, and when it should not be used."

- id: ai-literacy
  ru: грамотность в области AI
  en: AI literacy
  term_en: "AI literacy"
  definition: "Понимание того, что AI умеет и чего не умеет. Оно нужно каждому, кто им пользуется."
  definition_en: "Understanding what AI can and can’t do. Everyone who uses AI needs it."

- id: ai-incident
  ru: инцидент AI
  en: AI incident
  term_en: "AI incident"
  definition: "Событие, при котором применение AI причиняет или может причинить вред, ведёт к нарушению правил или к утрате контроля. Сюда же относятся случаи, когда вред удалось предотвратить."
  definition_en: "An event in which a use of AI causes or may cause harm, or leads to a breach of rules or a loss of control. This includes cases where the harm was prevented."

- id: shadow-ai
  ru: теневой AI
  en: shadow AI
  term_en: "shadow AI"
  definition: "Инструменты AI, которыми сотрудники пользуются в работе в обход тех, что организация предоставляет для таких данных."
  definition_en: "AI tools that employees use at work in place of the ones the organization provides for that kind of data."

- id: open-banking
  ru: открытый банкинг
  en: open banking
  term_en: "open banking"
  definition: "Доступ лицензированных третьих лиц к данным о счетах и к инициированию платежей через интерфейсы, с согласия клиента."
  definition_en: "Access by licensed third parties to account data and to payment initiation through interfaces, with the customer’s consent."

- id: embedded-finance
  ru: встроенные финансовые услуги
  en: embedded finance
  term_en: "embedded finance"
  definition: "Финансовые услуги внутри нефинансового продукта или приложения, предоставляемые через банк-партнёр."
  definition_en: "Financial services inside a non-financial product or app, provided through a partner bank."

- id: regtech
  ru: регуляторные технологии
  en: regtech
  term_en: "regtech"
  definition: "Технологии, в том числе AI, в работе по соблюдению требований: скрининг, мониторинг, отчётность, отслеживание изменений регулирования."
  definition_en: "Technology, including AI, used in compliance work: screening, monitoring, reporting, and tracking regulatory change."

- id: alternative-data
  ru: альтернативные данные
  en: alternative data
  term_en: "alternative data"
  definition: "Данные помимо кредитной истории, по которым оценивают клиента: транзакционные, мобильные, поведенческие. С ними связаны особые вопросы справедливости и согласия."
  definition_en: "Data other than credit history that is used to assess a customer: transactional, mobile, behavioral. It raises particular questions of fairness and consent."

- id: liveness-check
  ru: проверка присутствия живого человека
  en: liveness check
  term_en: "liveness check"
  definition: "Проверка того, что документ предъявляет живой человек, который действительно присутствует, а не его фотография или запись."
  definition_en: "A check that a document is presented by a live person who is actually there, not by a photo or a recording of them."

- id: real-time-scoring
  ru: скоринг в реальном времени
  en: real-time scoring
  term_en: "real-time scoring"
  definition: "Оценка, которую модель выдаёт за время самой транзакции или обращения, например при выявлении мошенничества."
  definition_en: "A score that a model produces while the transaction or request itself is still in progress, for example in fraud detection."

- id: rag
  ru: ответы с опорой на поиск по документам
  en: RAG
  term_en: "RAG"
  definition: "Подход, при котором модель в момент вопроса получает подходящие фрагменты проверенных документов и отвечает по ним со ссылками, а не по памяти."
  definition_en: "Retrieval-augmented generation: an approach in which, at the moment of a question, the model receives relevant passages from verified documents and answers from them with references, rather than from memory."

- id: kyc
  ru: идентификация и проверка клиента
  en: KYC
  term_en: "KYC"
  definition: "Установление и проверка личности клиента и оценка связанного с ним риска при оформлении и в ходе обслуживания."
  definition_en: "Know your customer: establishing and verifying a customer’s identity and assessing the related risk, at onboarding and throughout the relationship."

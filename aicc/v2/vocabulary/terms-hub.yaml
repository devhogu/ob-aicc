- id: knowledge-base
  ru: база знаний
  en: knowledge base
  definition: "Собранные в одном месте документы и правила, у которых есть владелец и срок пересмотра. AI отвечает по ним и показывает, откуда взят ответ."

- id: maturity-level
  ru: уровень зрелости
  en: maturity level
  definition: "Ступень на пути внедрения AI: от первых контролируемых экспериментов до работы AI-агентов. Ступень считается пройденной, когда её показатели выполнены."

- id: governance
  ru: управление и контроль
  en: governance
  definition: "Как устроены решения и ответственность вокруг работы с AI: стратегия и способ работы, документы и процессы, правила и критерии, риски, проверки и наблюдение за работающими решениями."

- id: strategic-theme
  ru: стратегическая тема
  en: strategic theme
  definition: "Область, в которой AI должен дать бизнесу больше всего пользы в ближайшие годы. Каждая инициатива вносит вклад хотя бы в одну тему."

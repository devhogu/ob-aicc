<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{gateway_title}}</title>
<script>
/* Servers such as Caddy handle_path answer /aicc (no trailing slash) with this page, which would make the
   relative links below resolve at the server root. Add the slash first, then choose the language. */
try{var p=location.pathname;
if(!/\/$|\.html$/.test(p)){location.replace(p+'/'+location.search+location.hash)}
else{var l=localStorage.getItem('aicc-lang');location.replace((l==='en'?'en':'ru')+'/index.html')}}catch(e){}
</script>
<noscript><meta http-equiv="refresh" content="0; url=ru/index.html"></noscript>
<link rel="stylesheet" href="assets/aicc.css">

</head>
<body>
<div class="oc-gateway">
 <img src="assets/ui-comps/logos/obank-on-dark.svg" alt="O!Bank" class="gateway-logo" width="126" height="48">
 <h1>{{gateway_title}}</h1>
 <p><a class="oc-button oc-button--primary" href="ru/index.html" lang="ru">{{gateway_link}}</a> <a class="oc-button" href="en/index.html" lang="en">English</a></p>
</div>
</body>
</html>
